<script>

var h = R.createElement;

var useEffect = R.useEffect;

var RC = Recharts;

var API = 'http://localhost:8000/api/v1';
var COLORS = ['#16a34a','#2563eb','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#65a30d'];

function inr(n){if(n==null)return'—';var a=Math.abs(n);if(a>=1e7)return'₹'+(n/1e7).toFixed(1)+' Cr';if(a>=1e5)return'₹'+(n/1e5).toFixed(1)+' L';return'₹'+Math.round(n).toLocaleString('en-IN');}

  post:function(p,b){return fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});},

// ── UI ATOMS ──────────────────────────────────────────────────────────────────
function Spin(){return h('span',{style:{display:'inline-block',width:14,height:14,border:'2px solid currentColor',borderTopColor:'transparent',borderRadius:'50%',animation:'spin .7s linear infinite'}});}

function Btn(p){
  var base={display:'inline-flex',alignItems:'center',gap:6,padding:'7px 16px',borderRadius:8,fontSize:13,fontWeight:500,border:'none',cursor:p.disabled||p.loading?'not-allowed':'pointer',opacity:p.disabled||p.loading?.5:1,transition:'background .15s'};
  var v={primary:{background:'#15803d',color:'#fff'},secondary:{background:'#1e293b',color:'#cbd5e1'},ghost:{background:'transparent',color:'#64748b'},danger:{background:'#b91c1c',color:'#fff'}};
  return h('button',{onClick:p.onClick,disabled:p.disabled||p.loading,style:Object.assign({},base,v[p.v||'primary'],p.style||{})},p.loading&&h(Spin,null),p.children);
}

function Card(p){return h('div',{style:Object.assign({background:'#0f172a',border:'1px solid #1e293b',borderRadius:12,padding:20},p.style||{})},p.children);}

function KPI(p){
  var clr={green:'#22c55e',blue:'#60a5fa',amber:'#fbbf24',red:'#f87171'}[p.color]||'#22c55e';
  return h(Card,null,h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:6}},h('span',{style:{fontSize:11,color:'#475569',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:500}},p.label),p.icon&&h('span',{style:{fontSize:18}},p.icon)),h('div',{style:{fontSize:22,fontWeight:700,color:clr}},p.value),p.sub&&h('div',{style:{fontSize:11,color:'#475569',marginTop:4}},p.sub));
}

function Badge(p){
  var s={green:{background:'#14532d',color:'#86efac'},blue:{background:'#1e3a5f',color:'#93c5fd'},amber:{background:'#451a03',color:'#fcd34d'},red:{background:'#450a0a',color:'#fca5a5'},slate:{background:'#1e293b',color:'#94a3b8'}};
  var st=s[p.color||'slate']||s.slate;
  return h('span',{style:Object.assign({fontSize:11,padding:'2px 8px',borderRadius:20,fontWeight:500},st)},p.children);
}

function SH(p){return h('div',{style:{marginBottom:14}},h('h2',{style:{fontSize:14,fontWeight:600,color:'#f1f5f9',margin:0}},p.title),p.sub&&h('p',{style:{fontSize:11,color:'#475569',marginTop:2}},p.sub));}

function Toast(p){return h('div',{style:{position:'fixed',top:16,right:16,zIndex:9999,display:'flex',flexDirection:'column',gap:8,pointerEvents:'none'}},p.toasts.map(function(t){return h('div',{key:t.id,style:{padding:'10px 16px',borderRadius:8,fontSize:13,fontWeight:500,background:t.type==='error'?'#dc2626':'#15803d',color:'#fff',boxShadow:'0 4px 20px rgba(0,0,0,.5)',pointerEvents:'auto'}},t.msg);}));}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function LoginPage(p){
  var rs=useState(null),role=rs[0],setRole=rs[1];
  var ps=useState(''),pin=ps[0],setPin=ps[1];
  var ns=useState(''),name=ns[0],setName=ns[1];
  var phs=useState(''),phone=phs[0],setPhone=phs[1];
  var es=useState(''),err=es[0],setErr=es[1];
  var ls=useState(false),loading=ls[0],setLoading=ls[1];

  function doAdmin(){setLoading(true);setTimeout(function(){p.onLogin({role:'admin',name:'Admin'});},400);}

    if(!name.trim()){setErr('Enter your name');return;}

    if(pin!=='1234'){setErr('Wrong PIN — demo PIN is 1234');return;}

    h('div',{style:{width:'100%',maxWidth:700}},
      h('div',{style:{textAlign:'center',marginBottom:40}},
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:12,marginBottom:8}},
          h('div',{style:{width:52,height:52,background:'#14532d',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26}},'🏭'),
          h('div',null,h('h1',{style:{fontSize:26,fontWeight:800,color:'#fff',margin:0}},'SME-Twin'),h('p',{style:{fontSize:13,color:'#22c55e',margin:0,fontWeight:500}},'Zero-Hardware Energy Intelligence'))
        ),
        h('p',{style:{fontSize:13,color:'#475569',maxWidth:380,margin:'0 auto'}},'Calibrated digital twin for Indian manufacturing SMEs — optimise energy with zero hardware.')

      !role&&h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,maxWidth:580,margin:'0 auto'}},
        h('div',{onClick:doAdmin,style:{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:16,padding:28,cursor:'pointer'}},
          h('div',{style:{fontSize:32,marginBottom:14}},'👑'),
          h('h2',{style:{fontSize:17,fontWeight:700,color:'#fff',marginBottom:8}},'Admin'),
          h('p',{style:{fontSize:13,color:'#475569',lineHeight:1.6,marginBottom:16}},'Full access — all factories, twin, optimizer, compliance, alerts.'),
          h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
            h('span',{style:{fontSize:11,background:'#14532d',color:'#86efac',padding:'3px 10px',borderRadius:20}},'No credentials'),
            loading?h(Spin,null):h('span',{style:{color:'#22c55e',fontSize:16}},'→')
          )
        ),
        h('div',{onClick:function(){setRole('supervisor');},style:{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:16,padding:28,cursor:'pointer'}},
          h('div',{style:{fontSize:32,marginBottom:14}},'🔧'),
          h('h2',{style:{fontSize:17,fontWeight:700,color:'#fff',marginBottom:8}},'Supervisor'),
          h('p',{style:{fontSize:13,color:'#475569',lineHeight:1.6,marginBottom:16}},"Floor access — today's schedule, machine status, send alerts."),
          h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
            h('span',{style:{fontSize:11,background:'#1e3a5f',color:'#93c5fd',padding:'3px 10px',borderRadius:20}},'PIN required'),
            h('span',{style:{color:'#60a5fa',fontSize:16}},'→')
          )
        )
      ),
      role==='supervisor'&&h('div',{style:{maxWidth:360,margin:'0 auto',background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:16,padding:28}},
        h('button',{onClick:function(){setRole(null);setErr('');setPin('');},style:{background:'none',border:'none',color:'#475569',fontSize:13,cursor:'pointer',marginBottom:16}},'← Back'),
        h('div',{style:{fontSize:28,marginBottom:12}},'🔧'),
        h('h2',{style:{fontSize:17,fontWeight:700,color:'#fff',marginBottom:4}},'Supervisor Login'),
        h('p',{style:{fontSize:12,color:'#475569',marginBottom:20}},'Demo PIN: 1234'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:12}},
          h('div',null,h('label',{style:{fontSize:11,color:'#64748b',display:'block',marginBottom:4,fontWeight:500}},'Name'),h('input',{type:'text',value:name,onChange:function(e){setName(e.target.value);setErr('');},placeholder:'e.g. Ramesh Patil',style:{width:'100%',background:'#1e293b',border:'1px solid #334155',color:'#f1f5f9',borderRadius:8,padding:'8px 12px',fontSize:13}})),
          h('div',null,h('label',{style:{fontSize:11,color:'#64748b',display:'block',marginBottom:4,fontWeight:500}},'Phone'),h('input',{type:'tel',value:phone,onChange:function(e){setPhone(e.target.value);setErr('');},placeholder:'+91 9876543210',style:{width:'100%',background:'#1e293b',border:'1px solid #334155',color:'#f1f5f9',borderRadius:8,padding:'8px 12px',fontSize:13}})),
          h('div',null,h('label',{style:{fontSize:11,color:'#64748b',display:'block',marginBottom:4,fontWeight:500}},'PIN'),h('input',{type:'password',value:pin,maxLength:4,onChange:function(e){setPin(e.target.value);setErr('');},onKeyDown:function(e){if(e.key==='Enter')doSup();},placeholder:'1234',style:{width:'100%',background:'#1e293b',border:'1px solid #334155',color:'#f1f5f9',borderRadius:8,padding:'8px 12px',fontSize:13}})),
          err&&h('div',{style:{background:'#450a0a',border:'1px solid #7f1d1d',color:'#fca5a5',fontSize:13,padding:'8px 12px',borderRadius:8}},err),
          h(Btn,{onClick:doSup,loading:loading,v:'primary'},'Sign In →')
        )
      ),
      h('p',{style:{textAlign:'center',marginTop:28,fontSize:11,color:'#1e293b'}},'SME-Twin · SDG 7 & 9 · Zero-hardware energy intelligence')
    )
  );
}

// ── SIDEBAR ───────────────────────────────────────────────────────────────────
var NAV=[{id:'dashboard',label:'Dashboard',icon:'⚡'},{id:'twin',label:'Digital Twin',icon:'🏭'},{id:'optimizer',label:'Optimizer',icon:'📊'},{id:'benchmark',label:'Benchmarking',icon:'📈'},{id:'compliance',label:'Compliance',icon:'📋'},{id:'alerts',label:'Alerts',icon:'🔔'},{id:'onboarding',label:'Onboarding',icon:'➕'}];

function Sidebar(p){
  return h('aside',{style:{width:210,minHeight:'100vh',background:'#020617',borderRight:'1px solid #0f172a',display:'flex',flexDirection:'column',flexShrink:0}},
    h('div',{style:{padding:'14px 16px',borderBottom:'1px solid #0f172a'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:2}},h('span',{style:{fontSize:16}},'🏭'),h('span',{style:{fontSize:14,fontWeight:700,color:'#22c55e'}},'SME-Twin')),
      h('p',{style:{fontSize:10,color:'#334155'}},'Energy Intelligence')
    ),
    h('div',{style:{padding:'8px 12px',borderBottom:'1px solid #0f172a'}},
      h('label',{style:{fontSize:10,color:'#334155',display:'block',marginBottom:3,textTransform:'uppercase',letterSpacing:'.05em'}},'Factory'),
      h('select',{value:p.factory?p.factory.id:'',onChange:function(e){var f=p.factories.find(function(x){return x.id===e.target.value;});if(f)p.setFactory(f);},style:{width:'100%',background:'#0f172a',border:'1px solid #1e293b',color:'#94a3b8',borderRadius:6,padding:'4px 8px',fontSize:12}},
        p.factories.map(function(f){return h('option',{key:f.id,value:f.id},f.name);})
      )
    ),
    h('nav',{style:{flex:1,padding:'6px'}},
      NAV.map(function(n){
        var active=p.page===n.id;
        return h('button',{key:n.id,onClick:function(){p.setPage(n.id);},style:{width:'100%',display:'flex',alignItems:'center',gap:8,padding:'7px 12px',borderRadius:7,border:'none',fontSize:12,fontWeight:500,marginBottom:1,background:active?'#14532d':'transparent',color:active?'#86efac':'#475569',cursor:'pointer',textAlign:'left'}},h('span',null,n.icon),n.label);
      })

    h('div',{style:{padding:'10px 14px',borderTop:'1px solid #0f172a'}},

}

function Header(p){
  var titles={dashboard:'Dashboard',twin:'Digital Twin',optimizer:'Schedule Optimizer',benchmark:'Benchmarking',compliance:'Compliance & DPR',alerts:'Voice & WhatsApp Alerts',onboarding:'Onboarding'};

      h('div',{style:{display:'flex',alignItems:'center',gap:4,background:'#052e16',border:'1px solid #14532d',padding:'3px 9px',borderRadius:20}},h('div',{style:{width:6,height:6,borderRadius:'50%',background:'#22c55e',animation:'pu 2s ease-in-out infinite'}}),h('span',{style:{fontSize:11,color:'#22c55e',fontWeight:500}},'Live')),

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard(p){
  var f=p.factory||MF,s=p.schedule||MS;
  var bill=f.latest_bill||MF.latest_bill,cal=f.latest_calibration||MF.latest_calibration;
  var dc=cal&&cal.calibrated_duty_cycles||{};
  var totalKw=f.machines.reduce(function(a,m){return a+m.rated_kw;},0);
  var pieData=f.machines.map(function(m){return{name:m.name,value:Math.round(m.rated_kw/totalKw*100)};});
  var hourly=Array.from({length:24},function(_,i){
    var bl=0,op=0;
    f.machines.forEach(function(m){var d=dc[m.id]||.6;bl+=m.rated_kw*(i>=6&&i<22?d*1.2:d*.5);op+=m.rated_kw*((s.hourly_schedule&&s.hourly_schedule[m.id])?s.hourly_schedule[m.id][i]:(i>=6&&i<22?d*.9:d*.4));});
    return{h:i+'h',baseline:Math.round(bl),optimized:Math.round(op)};
  });
  var monthly=(s.estimated_daily_savings||9420)*30;
  var billAmt=(bill.total_kwh||84200)*8.5;

  return h('div',{style:{display:'flex',flexDirection:'column',gap:18}},
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}},
      h(KPI,{label:'Monthly Bill',value:inr(billAmt),sub:'September 2026',icon:'💰',color:'amber'}),
      h(KPI,{label:'Simulated Savings',value:inr(monthly),sub:fmt(s.savings_percent)+'% reduction',icon:'📉',color:'green'}),
      h(KPI,{label:'Carbon Footprint',value:((bill.total_kwh||84200)*.82/1000).toFixed(1)+' tCO₂',sub:'This month',icon:'🌱',color:'blue'}),
      h(KPI,{label:'Twin Accuracy',value:fmt(cal&&cal.simulation_error_pct||3.2)+'% error',sub:'Calibrated Oct 2026',icon:'🎯',color:'green'})
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr',gap:14}},
      h(Card,null,
        h(SH,{title:'24-Hour Load Profile',sub:'Baseline vs. Optimised (kW)'}),
        h(RC.ResponsiveContainer,{width:'100%',height:190},
          h(RC.LineChart,{data:hourly,margin:{top:5,right:5,left:-25,bottom:0}},
            h(RC.CartesianGrid,{strokeDasharray:'3 3',stroke:'#1e293b'}),
            h(RC.XAxis,{dataKey:'h',tick:{fill:'#334155',fontSize:10}}),
            h(RC.YAxis,{tick:{fill:'#334155',fontSize:10}}),
            h(RC.Tooltip,{contentStyle:{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:8}}),
            h(RC.Legend,{wrapperStyle:{fontSize:11}}),
            h(RC.Line,{type:'monotone',dataKey:'baseline',stroke:'#334155',strokeWidth:2,dot:false,name:'Baseline'}),
            h(RC.Line,{type:'monotone',dataKey:'optimized',stroke:'#22c55e',strokeWidth:2.5,dot:false,name:'Optimised'})
          )
        )
      ),
      h(Card,null,
        h(SH,{title:'Energy Breakdown'}),
        h(RC.ResponsiveContainer,{width:'100%',height:150},
          h(RC.PieChart,null,
            h(RC.Pie,{data:pieData,cx:'50%',cy:'50%',innerRadius:38,outerRadius:60,dataKey:'value',paddingAngle:2},
              pieData.map(function(_,i){return h(RC.Cell,{key:i,fill:COLORS[i%COLORS.length]});})
            ),
            h(RC.Tooltip,{contentStyle:{background:'#0a0f1e',border:'1px solid #1e293b',borderRadius:8}})
          )
        ),
        h('div',{style:{display:'flex',flexWrap:'wrap',gap:5,marginTop:4}},
          pieData.slice(0,5).map(function(d,i){return h('div',{key:i,style:{display:'flex',alignItems:'center',gap:3,fontSize:10,color:'#475569'}},h('div',{style:{width:7,height:7,borderRadius:2,background:COLORS[i]}}),d.name.split(' ')[0]);})
        )
      )
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'3fr 2fr',gap:14}},
      h(Card,null,
        h(SH,{title:'Top Recommendations'}),
        h('div',{style:{display:'flex',flexDirection:'column',gap:8}},
          [{a:'Shift Dyeing Vat to 10 PM–8 AM',s:10260,p:'HIGH',i:'💧'},{a:'Stagger Air Compressor starts by 15 min',s:3800,p:'MEDIUM',i:'💨'},{a:'Power factor correction capacitors',s:2100,p:'MEDIUM',i:'⚡'}]
          .map(function(r,i){return h('div',{key:i,style:{display:'flex',alignItems:'center',justifyContent:'space-between',background:'#1e293b',borderRadius:8,padding:'9px 13px'}},h('div',{style:{display:'flex',alignItems:'center',gap:8}},h('span',{style:{fontSize:16}},r.i),h('div',null,h('div',{style:{fontSize:12,fontWeight:500,color:'#e2e8f0'}},r.a),h('div',{style:{fontSize:11,color:'#475569'}},'Est. '+inr(r.s)+'/mo'))),h(Badge,{color:r.p==='HIGH'?'red':'amber'},r.p));})
        )
      ),
      h(Card,null,
        h(SH,{title:'SDG Impact'}),
        [{label:'⚡ SDG 7 — Clean Energy',pct:68,color:'#fbbf24'},{label:'🏭 SDG 9 — Industry',pct:54,color:'#60a5fa'}].map(function(s2){return h('div',{key:s2.label,style:{marginBottom:12}},h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:5}},h('span',{style:{color:'#e2e8f0'}},s2.label),h('span',{style:{color:'#64748b'}},s2.pct+'%')),h('div',{style:{background:'#1e293b',borderRadius:99,height:5}},h('div',{style:{background:s2.color,height:5,borderRadius:99,width:s2.pct+'%'}})));})
      )
    )
  );
}

// ── DIGITAL TWIN ──────────────────────────────────────────────────────────────
function Twin(p){
  var f=p.factory||MF,cal=f.latest_calibration||MF.latest_calibration;

function App(){
  var su=useState(null),user=su[0],setUser=su[1];
  var sp=useState('dashboard'),page=sp[0],setPage=sp[1];
  var sf=useState(MF),factory=sf[0],setFactory=sf[1];
  var sfs=useState([MF]),factories=sfs[0],setFactories=sfs[1];
  var ss=useState(MS),schedule=ss[0],setSchedule=ss[1];
  var sc=useState(false),calibrating=sc[0],setCalibrating=sc[1];
  var so=useState(false),optimizing=so[0],setOptimizing=so[1];
  var st=useState([]),toasts=st[0],setToasts=st[1];

  function toast(msg,type){var id=Date.now();setToasts(function(t){return t.concat([{id:id,msg:msg,type:type||'success'}]);});setTimeout(function(){setToasts(function(t){return t.filter(function(x){return x.id!==id;});});},3500);}

  useEffect(function(){
    if(!user)return;
    api.get('/factory').then(function(fs){if(fs&&fs.length){setFactories(fs);setFactory(fs[0]);}}).catch(function(){});
  },[user?user.role:null]);

  function calibrate(){if(!factory||!factory.id)return;setCalibrating(true);api.post('/twin/calibrate/'+factory.id,{}).then(function(r){setFactory(function(f){return Object.assign({},f,{latest_calibration:r});});toast('Calibrated — '+fmt(r.simulation_error_pct)+'% error');}).catch(function(){toast('Demo calibration','error');setFactory(function(f){return Object.assign({},f,{latest_calibration:MF.latest_calibration});});}).finally(function(){setCalibrating(false);});}
  function optimize(){if(!factory||!factory.id)return;setOptimizing(true);api.post('/twin/optimize/'+factory.id,{}).then(function(r){setSchedule(r);toast(inr(r.estimated_daily_savings*30)+'/month savings found');}).catch(function(){toast('Demo optimization','error');setSchedule(MS);}).finally(function(){setOptimizing(false);});}
  function onFactoryCreated(f){setFactories(function(prev){return prev.find(function(x){return x.id===f.id;})?prev.map(function(x){return x.id===f.id?f:x;}):[f].concat(prev);});setFactory(f);setPage('dashboard');toast(f.name+' is live!');}

  if(!user)return h(LoginPage,{onLogin:setUser});

  var pages={
    dashboard:h(Dashboard,{factory:factory,schedule:schedule}),
    twin:h(Twin,{factory:factory,onCalibrate:calibrate,calibrating:calibrating}),
    optimizer:h(Optimizer,{factory:factory,schedule:schedule,onOptimize:optimize,optimizing:optimizing}),
    benchmark:h(Benchmark,{factory:factory}),
    compliance:h(Compliance,{factory:factory}),
    alerts:h(Alerts,{factory:factory}),
    onboarding:h(Onboarding,{onFactoryCreated:onFactoryCreated})

    h(Sidebar,{page:page,setPage:setPage,factory:factory,factories:factories,setFactory:setFactory}),
    h('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
      h(Header,{page:page,factory:factory,user:user,onLogout:function(){setUser(null);}}),
      h('main',{style:{flex:1,overflowY:'auto',padding:22,background:'#0a0f1e'}},pages[page]||pages.dashboard)
    ),
    h(Toast,{toasts:toasts})
  );
}
