// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  var su=useState(null),user=su[0],setUser=su[1];
  var sp=useState('twin'),page=sp[0],setPage=sp[1];
  var sf=useState(MF),factory=sf[0],setFactory=sf[1];
  var sfs=useState([MF]),factories=sfs[0],setFactories=sfs[1];
  var sd=useState(true),isDemo=sd[0],setIsDemo=sd[1];
  var ss=useState(null),schedule=ss[0],setSchedule=ss[1];
  var sfl=useState(false),factoryLoading=sfl[0],setFactoryLoading=sfl[1];
  var sc=useState(false),calibrating=sc[0],setCalibrating=sc[1];
  var so=useState(false),optimizing=so[0],setOptimizing=so[1];
  var st=useState([]),toasts=st[0],setToasts=st[1];

  function toast(msg,type){var id=Date.now();setToasts(function(t){return t.concat([{id:id,msg:msg,type:type||'success'}]);});setTimeout(function(){setToasts(function(t){return t.filter(function(x){return x.id!==id;});});},3500);}

  function loadFactory(summary){
    if(!summary||!summary.id)return Promise.resolve();
    setFactory(summary);
    setSchedule(null);
    setFactoryLoading(true);
    return api.get('/factory/'+summary.id).then(function(detail){
      setFactory(detail);
      setIsDemo(false);
      return api.get('/factory/'+summary.id+'/schedule').then(function(saved){setSchedule(saved);}).catch(function(){setSchedule(null);});
    }).catch(function(){
      toast('Could not load factory details. The sample workspace remains active.','error');
    }).finally(function(){setFactoryLoading(false);});
  }

  useEffect(function(){
    if(!user)return;
    api.get('/factory').then(function(fs){
      if(fs&&fs.length){setFactories(fs);loadFactory(fs[0]);}
      else{setIsDemo(true);setFactory(MF);setSchedule(null);}
    }).catch(function(){setIsDemo(true);setFactory(MF);setSchedule(null);toast('Factory API unavailable; the clearly labelled sample workspace is active.','error');});
  },[user?user.role:null]);

  function calibrate(){if(!factory||!factory.id||isDemo)return;setCalibrating(true);api.post('/twin/calibrate/'+factory.id,{}).then(function(){return api.get('/factory/'+factory.id);}).then(function(detail){setFactory(detail);toast('Calibration record updated');}).catch(function(){toast('Calibration failed. Check the factory bill and machine records.','error');}).finally(function(){setCalibrating(false);});}
  function optimize(){if(!factory||!factory.id||isDemo)return;setOptimizing(true);api.post('/twin/optimize/'+factory.id,{}).then(function(r){setSchedule(r);toast('Schedule optimization completed');}).catch(function(){toast('Optimization failed. Check the model inputs and try again.','error');}).finally(function(){setOptimizing(false);});}
  function onWeeklyObservationSaved(observation){
    setFactory(function(current){return Object.assign({},current,{
      latest_calibration:{
        calibrated_duty_cycles:observation.calibrated_duty_cycles,
        simulation_error_pct:observation.simulation_error_pct,
        timestamp:observation.created_at,
        source_weekly_observation_id:observation.id,
        actual_energy_kwh:observation.total_kwh,
        observed_period_hours:observation.hours_observed
      }
    });});
    setSchedule(null);
    toast('Weekly observations saved and twin recalibrated');
  }
  function onFactoryCreated(f){setFactories(function(prev){return prev.find(function(x){return x.id===f.id;})?prev.map(function(x){return x.id===f.id?f:x;}):[f].concat(prev);});setIsDemo(false);loadFactory(f);setPage('twin');}

  if(!user)return h(LoginPage,{onLogin:setUser});

  var pages={
    dashboard:h(Dashboard,{factory:factory,schedule:schedule,isDemo:isDemo,setPage:setPage}),
    twin:h(Twin,{factory:factory,isDemo:isDemo,loading:factoryLoading,onCalibrate:calibrate,calibrating:calibrating}),
    optimizer:h(Optimizer,{factory:factory,schedule:schedule,isDemo:isDemo,onOptimize:optimize,optimizing:optimizing}),
    benchmark:h(Benchmark,{factory:factory,isDemo:isDemo}),
    compliance:h(Compliance,{factory:factory,isDemo:isDemo}),
    alerts:h(Alerts,{factory:factory,isDemo:isDemo}),
    onboarding:h(Onboarding,{onFactoryCreated:onFactoryCreated})
  };

  return h('div',{className:'app-shell',style:{display:'flex',height:'100vh',overflow:'hidden'}},
    h(Sidebar,{page:page,setPage:setPage,factory:factory,factories:factories,onFactorySelect:loadFactory,isDemo:isDemo}),
    h('div',{className:'app-scroll',style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},
      h(Header,{page:page,factory:factory,user:user,isDemo:isDemo,onLogout:function(){setUser(null);}}),
      h('main',{className:'app-workspace',style:{flex:1,overflowY:'auto',padding:22,background:'#0a0f1e'}},page==='twin'?h('div',null,pages.twin,h(WeeklyCalibration,{factory:factory,isDemo:isDemo,onObservationSaved:onWeeklyObservationSaved})):pages[page]||pages.twin)
    ),
    h(Toast,{toasts:toasts})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
